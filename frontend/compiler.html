<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiler | CodeForge</title>
    <meta name="description" content="Write, compile and run C, C++, Java and Python code online instantly with CodeForge.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="compiler-body">

    <!-- ── Navigation ───────────────────────────────── -->
    <nav class="codex-nav" role="navigation" aria-label="Main navigation">
        <a href="index.html" class="nav-brand" aria-label="CodeForge Home">
            <div class="nav-logo" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
            </div>
            <span class="nav-title">CodeForge</span>
        </a>

        <button class="nav-hamburger" id="navHamburger" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <ul class="nav-links" id="navLinks" role="list">
            <li>
                <a href="index.html">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
            </li>
            <li>
                <a href="compiler.html" class="active" aria-current="page">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    Compiler
                </a>
            </li>
            <li>
                <a href="history.html">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    History
                </a>
            </li>
            <li>
                <a href="index.html#languages-section">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                    Languages
                </a>
            </li>
            <li>
                <a href="index.html#about-section">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    About
                </a>
            </li>
        </ul>

        <div class="nav-profile" aria-label="User profile">
            <div class="nav-profile-avatar" aria-hidden="true">D</div>
            <span id="navUserName">…</span>
        </div>
        <button class="nav-logout-btn" id="navLogoutBtn" aria-label="Logout from CodeForge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Logout
        </button>
    </nav>

    <!-- ── Compiler Workspace ────────────────────────── -->
    <div class="app-container">

        <!-- Breadcrumb -->
        <nav class="compiler-subnav" aria-label="Breadcrumb">
            <a href="index.html">Dashboard</a>
            <span aria-hidden="true">›</span>
            <span aria-current="page">Compiler</span>
            <span class="save-badge" id="saveBadge" style="display:none; margin-left:auto;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Saved to history
            </span>
        </nav>

        <!-- Main Compiler Grid -->
        <main class="compiler-grid" role="main">

            <!-- Left Panel: Editor & Input -->
            <section class="editor-section" aria-label="Code editor panel">
                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="language-picker">
                        <label for="languageSelect">Language:</label>
                        <div class="select-wrapper">
                            <select id="languageSelect" aria-label="Select programming language">
                                <option value="C">C (GCC 9.2)</option>
                                <option value="CPP">C++ (GCC 9.2)</option>
                                <option value="JAVA" selected>Java (OpenJDK 13)</option>
                                <option value="PYTHON">Python (3.8)</option>
                            </select>
                        </div>
                    </div>

                    <div class="editor-stats" aria-live="polite" aria-label="Editor statistics">
                        <span id="lineCount">Lines: 1</span>
                        <span class="stat-divider" aria-hidden="true">|</span>
                        <span id="charCount">Chars: 0</span>
                    </div>

                    <div class="button-group">
                        <button id="resetCodeBtn" class="btn btn-secondary" title="Reset to sample code" aria-label="Reset to sample code">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                            Reset Code
                        </button>
                        <button id="clearCodeBtn" class="btn btn-secondary" title="Clear code editor" aria-label="Clear code editor">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            Clear Code
                        </button>
                    </div>
                </div>

                <!-- Code Editor Wrapper -->
                <div class="editor-wrapper" role="group" aria-label="Code input area">
                    <div class="line-numbers" id="lineNumbers" aria-hidden="true">1</div>
                    <textarea
                        id="codeEditor"
                        spellcheck="false"
                        placeholder="Type your code here..."
                        aria-label="Code Editor"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                    ></textarea>
                </div>

                <!-- Input Section -->
                <div class="input-section">
                    <div class="section-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                        Standard Input (stdin)
                    </div>
                    <textarea
                        id="customInput"
                        placeholder="Enter custom inputs here (one input per line if required by your program)..."
                        spellcheck="false"
                        aria-label="Standard Input"
                    ></textarea>
                </div>
            </section>

            <!-- Right Panel: Controls & Output -->
            <section class="output-section" aria-label="Output panel">
                <div class="action-bar">
                    <button id="runBtn" class="btn btn-green" aria-label="Run code">
                        <span id="runBtnIcon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        </span>
                        <span id="runBtnText">Run Code</span>
                    </button>

                    <button id="clearOutputBtn" class="btn btn-secondary" aria-label="Clear output">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        Clear Output
                    </button>
                </div>

                <!-- Output Display Card -->
                <div class="output-card" role="region" aria-label="Execution output">
                    <div class="output-header">
                        <div class="output-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                            Execution Output
                        </div>
                        <div class="metrics">
                            <span id="statusBadge" class="status-badge status-ready" aria-live="polite">Ready</span>
                            <span id="executionTime" class="metric-pill" style="display: none;" aria-label="Execution time">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                <span id="timeVal">0.00s</span>
                            </span>
                            <span id="executionMemory" class="metric-pill" style="display: none;" aria-label="Memory used">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 19v-3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"></path><path d="M6 5v3a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5"></path></svg>
                                <span id="memoryVal">0 KB</span>
                            </span>
                        </div>
                    </div>

                    <!-- Terminal Content Viewport -->
                    <div class="terminal-viewport" id="terminalViewport" aria-live="polite">
                        <div class="placeholder-msg" id="placeholderMsg">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <p>Click "Run Code" to compile and execute your program.</p>
                        </div>
                        <div class="loader-overlay" id="loaderOverlay" style="display: none;" aria-label="Compiling and executing">
                            <div class="spinner" role="status" aria-label="Loading"></div>
                            <p>Compiling &amp; Executing Code...</p>
                        </div>
                        <pre id="outputContent" class="output-content" style="display: none;" aria-label="Program output"></pre>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="auth-guard.js"></script>
    <script src="compiler.js"></script>
</body>
</html>
