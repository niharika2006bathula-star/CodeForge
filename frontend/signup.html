<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CodeForge — Online Compiler & Code Execution Platform</title>
    <meta name="description" content="Create your CodeForge account to access the professional online compiler for C, C++, Java and Python.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

    <!-- ══════════════════════════════════════════════════
         MINIMAL HEADER
    ══════════════════════════════════════════════════ -->
    <header class="auth-header" role="banner">
        <a href="login.html" class="nav-brand auth-brand" aria-label="CodeForge Home">
            <div class="nav-logo" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
            </div>
            <span class="nav-title">CodeForge</span>
        </a>
    </header>

    <!-- ══════════════════════════════════════════════════
         SIGNUP MAIN
    ══════════════════════════════════════════════════ -->
    <main class="auth-main" role="main">

        <!-- Background glow orbs -->
        <div class="auth-bg-orb auth-bg-orb-1" aria-hidden="true"></div>
        <div class="auth-bg-orb auth-bg-orb-2" aria-hidden="true"></div>

        <div class="auth-container">

            <!-- Branding above card -->
            <div class="auth-brand-block" aria-label="CodeForge platform info">
                <div class="auth-brand-logo" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                </div>
                <h1 class="auth-brand-name">CodeForge</h1>
                <p class="auth-brand-tagline">Online Compiler &amp; Code Execution Platform</p>
            </div>

            <!-- Signup card -->
            <div class="auth-card" role="region" aria-label="Create account form">

                <div class="auth-card-header">
                    <h2 class="auth-card-title">Create Account</h2>
                    <p class="auth-card-subtitle">Join CodeForge today</p>
                </div>

                <!-- Status message (success state) -->
                <div id="signupStatus" class="auth-status" role="alert" aria-live="polite" hidden></div>

                <!-- Signup form -->
                <form id="signupForm" class="auth-form" novalidate aria-label="Create account form">

                    <!-- Full Name -->
                    <div class="auth-field" id="signupNameGroup">
                        <label for="signupName" class="auth-label">Full Name</label>
                        <input
                            type="text"
                            id="signupName"
                            name="fullname"
                            class="auth-input"
                            placeholder="Enter your full name"
                            required
                            autocomplete="name"
                            aria-describedby="signupNameError"
                            aria-required="true"
                        >
                        <span class="auth-error" id="signupNameError" role="alert" aria-live="polite"></span>
                    </div>

                    <!-- Email -->
                    <div class="auth-field" id="signupEmailGroup">
                        <label for="signupEmail" class="auth-label">Email</label>
                        <input
                            type="email"
                            id="signupEmail"
                            name="email"
                            class="auth-input"
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                            aria-describedby="signupEmailError"
                            aria-required="true"
                        >
                        <span class="auth-error" id="signupEmailError" role="alert" aria-live="polite"></span>
                    </div>

                    <!-- Password -->
                    <div class="auth-field" id="signupPasswordGroup">
                        <label for="signupPassword" class="auth-label">Password</label>
                        <div class="auth-input-wrapper">
                            <input
                                type="password"
                                id="signupPassword"
                                name="password"
                                class="auth-input"
                                placeholder="Create a password"
                                required
                                autocomplete="new-password"
                                aria-describedby="signupPasswordError"
                                aria-required="true"
                            >
                            <button
                                type="button"
                                class="auth-toggle-visibility"
                                id="toggleSignupPassword"
                                aria-label="Show password"
                                tabindex="0"
                            >
                                <svg class="icon-eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icon-eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <span class="auth-error" id="signupPasswordError" role="alert" aria-live="polite"></span>
                    </div>

                    <!-- Confirm Password -->
                    <div class="auth-field" id="signupConfirmGroup">
                        <label for="signupConfirm" class="auth-label">Confirm Password</label>
                        <div class="auth-input-wrapper">
                            <input
                                type="password"
                                id="signupConfirm"
                                name="confirm"
                                class="auth-input"
                                placeholder="Repeat your password"
                                required
                                autocomplete="new-password"
                                aria-describedby="signupConfirmError"
                                aria-required="true"
                            >
                            <button
                                type="button"
                                class="auth-toggle-visibility"
                                id="toggleSignupConfirm"
                                aria-label="Show confirm password"
                                tabindex="0"
                            >
                                <svg class="icon-eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icon-eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <span class="auth-error" id="signupConfirmError" role="alert" aria-live="polite"></span>
                    </div>

                    <!-- Submit button -->
                    <button type="submit" class="auth-btn-primary" id="signupSubmitBtn" aria-label="Create CodeForge account">
                        <span class="auth-btn-text">Create Account</span>
                        <span class="auth-btn-spinner" aria-hidden="true" hidden>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                            </svg>
                        </span>
                    </button>

                </form>

                <!-- Divider -->
                <div class="auth-divider" aria-hidden="true">
                    <span class="auth-divider-line"></span>
                    <span class="auth-divider-text">or</span>
                    <span class="auth-divider-line"></span>
                </div>

                <!-- Login link -->
                <p class="auth-switch-text">
                    Already have an account?
                    <a href="login.html" class="auth-link" id="goToLoginLink">Sign In</a>
                </p>

            </div>

        </div>
    </main>

    <script src="signup.js"></script>
</body>
</html>
